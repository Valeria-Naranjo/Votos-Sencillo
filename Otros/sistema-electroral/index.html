<!doctype html>
<html lang="es">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Sistema de Registro Electoral</title>
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
      <style>
         :root {
            --guinda: #9b2242;
            --guinda-dark: #651d32;
            --gris-cool: #474c55;
            --gris: #727372;
            --gris-claro: #b8b6af;
            --negro: #130d0e;
            --blanco: #fafaf8;
            --superficie: #f5f3ef;
            --sidebar-w: 260px;
            --header-h: 64px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
         }

         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         }

         body {
            font-family: "Nunito Sans", sans-serif;
            background: var(--superficie);
            color: var(--negro);
            min-height: 100vh;
            overflow-x: hidden;
         }

         /* FONDO PATTERN */
         body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
               radial-gradient(circle at 15% 85%, rgba(155, 34, 66, 0.06) 0%, transparent 50%),
               radial-gradient(circle at 85% 15%, rgba(101, 29, 50, 0.05) 0%, transparent 50%),
               radial-gradient(circle at 50% 50%, rgba(71, 76, 85, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
         }

         /* PATTERN geométrico discreto */
         body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239B2242' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
         }

         /* HEADER */
         .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: var(--guinda-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px 0 calc(var(--sidebar-w) + 24px);
            z-index: 100;
            border-bottom: 2px solid rgba(155, 34, 66, 0.4);
            box-shadow: 0 2px 20px rgba(19, 13, 14, 0.3);
         }

         .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
         }
         .header-title {
            font-family: "Playfair Display", serif;
            font-size: 18px;
            color: #fff;
            letter-spacing: 0.3px;
         }
         .header-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
         }

         .user-menu-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 6px 14px 6px 8px;
            cursor: pointer;
            transition: var(--transition);
            color: #fff;
            position: relative;
         }
         .user-menu-btn:hover {
            background: rgba(255, 255, 255, 0.15);
         }

         .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--guinda), #c0394f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
         }
         .user-name {
            font-size: 13px;
            font-weight: 600;
         }
         .user-role {
            font-size: 10px;
            opacity: 0.6;
         }

         .dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(19, 13, 14, 0.18);
            border: 1px solid rgba(184, 182, 175, 0.3);
            min-width: 200px;
            overflow: hidden;
            animation: dropIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
         }
         @keyframes dropIn {
            from {
               opacity: 0;
               transform: translateY(-8px) scale(0.96);
            }
            to {
               opacity: 1;
               transform: translateY(0) scale(1);
            }
         }

         .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--gris-cool);
            font-weight: 500;
            transition: background 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
         }
         .dropdown-item:hover {
            background: var(--superficie);
         }
         .dropdown-item.danger {
            color: #c0392b;
         }
         .dropdown-divider {
            height: 1px;
            background: var(--superficie);
            margin: 4px 0;
         }

         /* SIDEBAR */
         .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--negro);
            z-index: 99;
            display: flex;
            flex-direction: column;
            padding-top: var(--header-h);
            transition: var(--transition);
         }

         .sidebar-logo {
            padding: 20px 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
         }
         .logo-icon {
            width: 38px;
            height: 38px;
            background: var(--guinda);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
         }
         .logo-text {
            font-family: "Playfair Display", serif;
            font-size: 13px;
            color: #fff;
            line-height: 1.3;
         }
         .logo-sub {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
         }

         .nav-section-label {
            padding: 16px 20px 6px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.25);
         }

         .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 20px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            position: relative;
            border-radius: 0;
            margin: 1px 0;
         }
         .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
         }
         .nav-item.active {
            background: rgba(155, 34, 66, 0.2);
         }
         .nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--guinda);
            border-radius: 0 3px 3px 0;
         }
         .nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            transition: var(--transition);
         }
         .nav-item.active .nav-icon {
            background: rgba(155, 34, 66, 0.3);
         }
         .nav-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
         }
         .nav-item.active .nav-label {
            color: #fff;
         }
         .nav-badge {
            margin-left: auto;
            background: var(--guinda);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
         }

         .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
         }

         /* MAIN */
         .main {
            margin-left: var(--sidebar-w);
            padding-top: var(--header-h);
            min-height: 100vh;
            position: relative;
            z-index: 1;
         }

         .page {
            padding: 32px 32px;
            animation: pageIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
         }
         @keyframes pageIn {
            from {
               opacity: 0;
               transform: translateY(16px);
            }
            to {
               opacity: 1;
               transform: translateY(0);
            }
         }

         .page-header {
            margin-bottom: 28px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
         }
         .page-title {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            color: var(--negro);
            line-height: 1.2;
         }
         .page-subtitle {
            font-size: 13px;
            color: var(--gris);
            margin-top: 4px;
            font-weight: 500;
         }
         .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--gris-claro);
            margin-bottom: 6px;
         }
         .breadcrumb span {
            color: var(--guinda);
            font-weight: 600;
         }

         /* CARDS */
         .card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid rgba(184, 182, 175, 0.3);
            box-shadow: 0 1px 4px rgba(19, 13, 14, 0.05);
            overflow: hidden;
         }
         .card-body {
            padding: 24px;
         }
         .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(184, 182, 175, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
         }
         .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--gris-cool);
         }

         /* REGISTRO PAGE */
         .doc-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
         }

         .doc-option {
            border: 2px solid rgba(184, 182, 175, 0.4);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            background: #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
         }
         .doc-option::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(155, 34, 66, 0.03), transparent);
            opacity: 0;
            transition: var(--transition);
         }
         .doc-option:hover::before {
            opacity: 1;
         }
         .doc-option:hover {
            border-color: var(--guinda);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(155, 34, 66, 0.12);
         }
         .doc-option.selected {
            border-color: var(--guinda);
            background: linear-gradient(135deg, rgba(155, 34, 66, 0.04), rgba(101, 29, 50, 0.02));
            box-shadow: 0 4px 20px rgba(155, 34, 66, 0.15);
         }
         .doc-option.selected::before {
            opacity: 1;
         }

         .doc-check {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--guinda);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            transform: scale(0);
            transition: var(--transition);
         }
         .doc-option.selected .doc-check {
            transform: scale(1);
         }

         .doc-icon-wrap {
            font-size: 36px;
            margin-bottom: 10px;
            display: block;
         }
         .doc-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--gris-cool);
            margin-bottom: 4px;
         }
         .doc-desc {
            font-size: 11px;
            color: var(--gris);
            font-weight: 500;
         }

         /* DOCUMENT PREVIEW */
         .doc-preview {
            animation: slideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-bottom: 24px;
         }
         @keyframes slideIn {
            from {
               opacity: 0;
               transform: translateY(12px) scale(0.97);
            }
            to {
               opacity: 1;
               transform: translateY(0) scale(1);
            }
         }

         /* INE CARD */
         .ine-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            margin: 0 auto;
         }
         .ine-card::before {
            content: "";
            position: absolute;
            top: -30px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: rgba(155, 34, 66, 0.2);
            border-radius: 50%;
         }
         .ine-card::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 40px;
            width: 80px;
            height: 80px;
            background: rgba(101, 29, 50, 0.2);
            border-radius: 50%;
         }
         .ine-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
         }
         .ine-eagle {
            font-size: 28px;
         }
         .ine-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.8;
            line-height: 1.4;
         }
         .ine-stripe {
            height: 3px;
            background: linear-gradient(90deg, #c8102e, #ffffff, #006847);
            border-radius: 2px;
            margin-bottom: 14px;
         }
         .ine-body {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 14px;
            position: relative;
            z-index: 1;
         }
         .ine-photo {
            width: 80px;
            height: 96px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
         }
         .ine-field {
            margin-bottom: 8px;
         }
         .ine-field-label {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
            font-weight: 700;
         }
         .ine-field-val {
            font-size: 12px;
            font-weight: 600;
         }
         .ine-highlight {
            background: rgba(155, 34, 66, 0.3);
            border: 1px dashed rgba(255, 100, 100, 0.6);
            border-radius: 6px;
            padding: 6px 10px;
            animation: pulse 2s infinite;
            position: relative;
            z-index: 1;
            margin-top: 10px;
         }
         @keyframes pulse {
            0%,
            100% {
               box-shadow: 0 0 0 0 rgba(155, 34, 66, 0.4);
            }
            50% {
               box-shadow: 0 0 0 6px rgba(155, 34, 66, 0);
            }
         }
         .ine-highlight-label {
            font-size: 9px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
         }
         .ine-highlight-val {
            font-size: 14px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 2px;
         }

         /* DOC OFICIAL */
         .doc-card {
            background: linear-gradient(135deg, #f8f4e8 0%, #f0ead4 100%);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid rgba(155, 34, 66, 0.15);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
         }
         .doc-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(155, 34, 66, 0.03) 10px, rgba(155, 34, 66, 0.03) 11px);
         }
         .doc-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 2px solid rgba(155, 34, 66, 0.15);
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
         }
         .doc-seal {
            font-size: 36px;
         }
         .doc-institution {
            font-size: 10px;
            font-weight: 700;
            color: var(--guinda-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.4;
         }
         .doc-field {
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
         }
         .doc-field-label {
            font-size: 9px;
            color: var(--gris);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 2px;
         }
         .doc-field-val {
            font-size: 12px;
            font-weight: 600;
            color: var(--negro);
            border-bottom: 1px solid rgba(155, 34, 66, 0.2);
            padding-bottom: 4px;
         }
         .doc-highlight {
            background: rgba(155, 34, 66, 0.08);
            border: 2px dashed rgba(155, 34, 66, 0.4);
            border-radius: 8px;
            padding: 10px 12px;
            animation: pulse 2s infinite;
            position: relative;
            z-index: 1;
         }
         .doc-highlight-label {
            font-size: 9px;
            color: var(--guinda);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 3px;
         }
         .doc-highlight-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--guinda-dark);
         }

         /* FORM */
         .form-group {
            margin-bottom: 20px;
         }
         .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--gris-cool);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
         }
         .form-label span {
            color: var(--guinda);
         }
         .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid rgba(184, 182, 175, 0.5);
            border-radius: 10px;
            font-size: 15px;
            font-family: "Nunito Sans", sans-serif;
            font-weight: 600;
            color: var(--negro);
            background: #fff;
            transition: var(--transition);
            outline: none;
         }
         .form-input:focus {
            border-color: var(--guinda);
            box-shadow: 0 0 0 3px rgba(155, 34, 66, 0.1);
         }
         .form-input::placeholder {
            color: var(--gris-claro);
            font-weight: 400;
         }
         .form-input.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
         }
         .form-error {
            font-size: 11px;
            color: #e74c3c;
            margin-top: 5px;
            font-weight: 600;
         }

         .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--guinda);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: "Nunito Sans", sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
         }
         .btn-primary:hover:not(:disabled) {
            background: var(--guinda-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(155, 34, 66, 0.3);
         }
         .btn-primary:active:not(:disabled) {
            transform: translateY(0);
         }
         .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
         }

         .btn-secondary {
            padding: 10px 20px;
            background: transparent;
            color: var(--guinda);
            border: 1.5px solid var(--guinda);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: "Nunito Sans", sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
         }
         .btn-secondary:hover {
            background: rgba(155, 34, 66, 0.05);
            transform: translateY(-1px);
         }

         .btn-sm {
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 7px;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            font-family: "Nunito Sans", sans-serif;
         }
         .btn-sm-primary {
            background: var(--guinda);
            color: #fff;
         }
         .btn-sm-primary:hover {
            background: var(--guinda-dark);
         }
         .btn-sm-ghost {
            background: var(--superficie);
            color: var(--gris-cool);
         }
         .btn-sm-ghost:hover {
            background: rgba(184, 182, 175, 0.4);
         }
         .btn-sm-danger {
            background: rgba(231, 76, 60, 0.1);
            color: #c0392b;
         }
         .btn-sm-danger:hover {
            background: rgba(231, 76, 60, 0.2);
         }

         /* STATS GRID */
         .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
         }
         .stat-card {
            background: #fff;
            border-radius: 14px;

          */
         function validateCURP(str_curp) {
            const curp = str_curp.toUpperCase();
            let regex =
                  /^([A-Z][AEIOUX][A-Z]{2}\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])[HM](?:AS|B[CS]|C[CLMSH]|D[FG]|G[TR]|HG|JC|M[CNS]|N[ETL]|OC|PL|Q[TR]|S[PLR]|T[CSL]|VZ|YN|ZS)[B-DF-HJ-NP-TV-Z]{3}[A-Z\d])(\d)$/,
               validated = curp !== undefined ? curp.match(regex) : false;

            if (!validated)
               //Coincide con |el formato general?
               return false;

            //Validar que coincida el dígito verificador
            const checkDigit = (curp17) => {
               //Fuente https://consultas.curp.gob.mx/CurpSP/
               let diccionario = "0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZ",
                  lngSuma = 0.0,
                  lngDigito = 0.0;
               for (var i = 0; i < 17; i++) lngSuma = lngSuma + diccionario.indexOf(curp17.charAt(i)) * (18 - i);
               lngDigito = 10 - (lngSuma % 10);
               if (lngDigito == 10) return 0;
               return lngDigito;
            };

            if (validated[2] != checkDigit(validated[1])) return false;

            return true; //Validado

               // }
               if ([null, "", undefined].includes(tipoDoc) && curp.trim().length < 3) {
                  setError("Ingrese el nombre completo.");
                  return false;
               }
               if (!validateCURP(curp)) {
                  setError("formato de la CURP invalido");
                  return false;
               }

               return true;
            };

            const handleSubmit = async () => {
               setError("");
               if (!tipoDoc) {
                  setError("Seleccione un tipo de documento.");
                  return;
               }
               if (!error) return;
               if (!validate()) return;
               if (!validateCURP(curp)) {
                  setError("formato de la CURP invalido");
                  return;
               }

               setLoading(true);
               await new Promise((r) => setTimeout(r, 900));
               setLoading(false);

               const existe = participaciones.find((p) => p.curp.trim().toUpperCase() === curp.trim().toUpperCase());

               if (existe) {
                  setSwal({
                     type: "warning",
                     title: "Participación Duplicada",
                     text: `El registro "${curp.toUpperCase().trim()}" ya fue registrado en la ${existe.casilla} el ${existe.fecha}. Su participación ya está contabilizada.`,
                     btn: "Entendido"
                  });
                  return;
               }

               const nuevo = {
                  id: Date.now(),
                  tipo: tipoDoc,
                  curp: curp.trim(),
                  casilla: user.casilla.split("•")[0].trim(),
                  fecha: new Date().toLocaleString("es-MX", { hour12: false })
                  // nombre: tipoDoc === "DOC" ? curp.trim() : "Ciudadano registrado"
               };
               setParticipaciones((p) => [nuevo, ...p]);
               setSwal({
                  type: "success",
                  title: "¡Participación Registrada!",
                  text: `Su participación ha sido exitosamente registrada en ${nuevo.casilla}. Folio: #${nuevo.id}. ¡Gracias por ejercer su voto!`,
                  btn: "Continuar"
               });
               setCurp("");
               setTipoDoc(null);
            };

            return (
               <div className="page">
                  <div className="page-header">
                     <div>
                        <div className="breadcrumb">
                           Inicio <span>›</span> <span>Registrar Participación</span>

                  </div>

                  <div className="grid-2">

                           </div>

                              <div className="doc-selector">
                                 <div className={`doc-option ${tipoDoc === "INE" ? "selected" : ""}`} onClick={() => handleSelect("INE")}>

                                    <span className="doc-icon-wrap">🪪</span>
                                    <div className="doc-label">INE</div>
                                    <div className="doc-desc">Credencial para votar</div>
                                 </div>
                                 <div className={`doc-option ${tipoDoc === "DOC" ? "selected" : ""}`} onClick={() => handleSelect("DOC")}>
                                    <div className="doc-check">✓</div>
                                    <span className="doc-icon-wrap">📄</span>
                                    <div className="doc-label">Carta Identidad</div>
                                    <div className="doc-desc">Documento Oficial</div>
                                 </div>
                              </div>

                              {!tipoDoc && (
                                 <div className="empty-state" style={{ padding: "20px 0" }}>
                                    <div className="empty-icon" style={{ fontSize: 32 }}>
                                       ☝️
                                    </div>
                                    <div className="empty-title">Seleccione el tipo de documento que presentaste</div>
                                    <div className="empty-desc">Elija INE o Carta Identidad para continuar</div>
                                 </div>
                              )}

                              {tipoDoc && (
                                 <div style={{ animation: "slideIn 0.3s ease" }}>
                                    <div className="form-group">
                                       <label className="form-label">
                                          {"🔑 CURP"}
                                          <span> *</span>
                                       </label>
                                       <input
                                          className={`form-input ${error ? "error" : ""}`}
                                          type="text"
                                          placeholder={"Ej: XXXX123456XXXXXXXX"}
                                          // placeholder={tipoDoc === "INE" ? "Ej: GMZM750312HDFRRN04" : "Nombre completo del ciudadano"}
                                          value={curp}
                                          onChange={(e) => {
                                             const validate = validateCURP(e.target.value);
                                             setCurp(e.target.value);
                                             validate ? setError("") : setError("formato de la CURP invalido");
                                          }}
                                          onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
                                          style={{ textTransform: "uppercase" }}
                                       />
                                       {error && <div className="form-error">⚠ {error}</div>}
                                    </div>
                                    <button className="btn-primary" onClick={handleSubmit} disabled={loading}>
                                       {loading ? (
                                          <>
                                             <span className="spinner" /> Verificando...
                                          </>
                                       ) : (
                                          <>✓ Registrar Participación</>
                                       )}
                                    </button>
                                 </div>

                           </div>
                        </div>

                        {/* INSTRUCCIONES */}
                        <div className="card">

                           </div>
                           <div className="card-body">

                        </div>
                     </div>

                     {/* PREVIEW */}
                     <div>

                        </div>
                        {!tipoDoc && (

                        {tipoDoc === "INE" && (

         // ============ PAGE: CASILLAS ============
         function PageCasillas({ casillas, setCasillas }) {
            const [search, setSearch] = useState("");
            const [filter, setFilter] = useState("todas");
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ nombre: "", seccion: "", municipio: "", colonia: "", responsable: "" });

            const filtered = casillas.filter((c) => {
               const s = search.toLowerCase();
               const match = c.nombre.toLowerCase().includes(s) || c.municipio.toLowerCase().includes(s) || c.responsable.toLowerCase().includes(s);
               if (filter === "activas") return match && c.activa;
               if (filter === "inactivas") return match && !c.activa;
               return match;
            });

            const handleAdd = () => {
               if (!form.nombre || !form.responsable) return;
               setCasillas((prev) => [...prev, { ...form, id: Date.now(), activa: true }]);
               setForm({ nombre: "", seccion: "", municipio: "", colonia: "", responsable: "" });
               setShowForm(false);
            };

            return (
               <div className="page">
                  <div className="page-header">
                     <div>
                        <div className="breadcrumb">
                           Catálogos <span>›</span> <span>Casillas</span>
                        </div>
                        <h1 className="page-title">Catálogo de Casillas</h1>
                        <p className="page-subtitle">Administración de casillas electorales registradas</p>
                     </div>
                     <button className="btn-secondary" onClick={() => setShowForm((s) => !s)}>
                        {showForm ? "✕ Cancelar" : "+ Nueva Casilla"}
                     </button>
                  </div>

                  {showForm && (
                     <div className="card mb-6" style={{ animation: "slideIn 0.3s ease" }}>
                        <div className="card-header">
                           <span className="card-title">Nueva Casilla</span>
                        </div>
                        <div className="card-body">
                           <div className="grid-3 mb-4">
                              {[
                                 ["nombre", "Nombre de Casilla", "Casilla 05-A"],
                                 ["seccion", "Sección", "0105"],
                                 ["municipio", "Municipio", "Gómez Palacio"],
                                 ["colonia", "Colonia", "Guerrero"],
                                 ["responsable", "Responsable", "Lic. Nombre Apellido"]
                              ].map(([key, label, ph]) => (
                                 <div key={key} className="form-group">
                                    <label className="form-label">{label}</label>
                                    <input
                                       className="form-input"
                                       placeholder={ph}
                                       value={form[key]}
                                       onChange={(e) => setForm((f) => ({ ...f, [key]: e.target.value }))}
                                    />
                                 </div>
                              ))}
                           </div>
                           <button className="btn-primary" style={{ maxWidth: 200 }} onClick={handleAdd}>
                              ✓ Agregar Casilla
                           </button>
                        </div>
                     </div>
                  )}

                  <div className="card">
                     <div className="card-header">
                        <div className="search-wrap">
                           <div className="search-input-wrap">
                              <span className="search-icon">🔍</span>
                              <input
                                 className="search-input"
                                 placeholder="Buscar casilla, municipio, responsable..."
                                 value={search}
                                 onChange={(e) => setSearch(e.target.value)}
                              />
                           </div>
                           <select className="filter-select" value={filter} onChange={(e) => setFilter(e.target.value)}>
                              <option value="todas">Todas</option>
                              <option value="activas">Activas</option>
                              <option value="inactivas">Inactivas</option>
                           </select>
                        </div>
                        <span style={{ fontSize: 12, color: "var(--gris)", fontWeight: 600 }}>{filtered.length} casillas</span>
                     </div>
                     <div className="table-wrap">
                        <table>
                           <thead>
                              <tr>
                                 <th>Casilla</th>
                                 <th>Sección</th>
                                 <th>Municipio</th>
                                 <th>Colonia</th>
                                 <th>Responsable</th>
                                 <th>Estado</th>
                                 <th>Acciones</th>
                              </tr>
                           </thead>
                           <tbody>
                              {filtered.length === 0 && (
                                 <tr>
                                    <td colSpan="7">
                                       <div className="empty-state">
                                          <div className="empty-icon">🏛️</div>
                                          <div className="empty-title">Sin resultados</div>
                                          <div className="empty-desc">No se encontraron casillas con ese criterio</div>
                                       </div>
                                    </td>
                                 </tr>
                              )}

                                 <tr key={c.id}>

                                       <strong style={{ color: "var(--negro)" }}>{c.nombre}</strong>
                                    </td>
                                    <td>
                                       <span className="font-mono" style={{ fontSize: 12, color: "var(--gris)" }}>
                                          {c.seccion}

                                    <td>{c.municipio}</td>
                                    <td>{c.colonia}</td>

         // ============ PAGE: PARTICIPACIONES ============
         function PageParticipaciones({ participaciones }) {
            const [search, setSearch] = useState("");
            const [filtroTipo, setFiltroTipo] = useState("todos");
            const [filtroCasilla, setFiltroCasilla] = useState("todas");
            const chartRef1 = useRef(null);
            const chartRef2 = useRef(null);
            const chartInst1 = useRef(null);
            const chartInst2 = useRef(null);

            const casillas = [...new Set(participaciones.map((p) => p.casilla))];

            const filtered = participaciones.filter((p) => {
               const s = search.toLowerCase();
               const matchS = p.curp.toLowerCase().includes(s) || p.casilla.toLowerCase().includes(s);
               const matchT = filtroTipo === "todos" || p.tipo === filtroTipo;
               const matchC = filtroCasilla === "todas" || p.casilla === filtroCasilla;
               return matchS && matchT && matchC;
            });

            // Stats
            const totalINE = participaciones.filter((p) => p.tipo === "INE").length;
            const totalDOC = participaciones.filter((p) => p.tipo === "Carta Identidad").length;
            const byCasilla = casillas.map((c) => ({ casilla: c, count: participaciones.filter((p) => p.casilla === c).length }));

            useEffect(() => {
               if (!chartRef1.current || !chartRef2.current) return;
               if (typeof Chart === "undefined") return;

               if (chartInst1.current) chartInst1.current.destroy();
               if (chartInst2.current) chartInst2.current.destroy();

               chartInst1.current = new Chart(chartRef1.current, {
                  type: "doughnut",
                  data: {
                     labels: ["INE", "Carta Identidad"],
                     datasets: [{ data: [totalINE, totalDOC], backgroundColor: ["#9B2242", "#474C55"], borderWidth: 0, hoverOffset: 6 }]
                  },
                  options: {
                     responsive: true,
                     maintainAspectRatio: false,
                     cutout: "65%",
                     plugins: { legend: { position: "bottom", labels: { font: { family: "Nunito Sans", size: 12 }, padding: 12 } } }
                  }
               });

               chartInst2.current = new Chart(chartRef2.current, {
                  type: "bar",
                  data: {
                     labels: byCasilla.map((b) => b.casilla),
                     datasets: [{ label: "Participaciones", data: byCasilla.map((b) => b.count), backgroundColor: "#9B2242", borderRadius: 6, borderSkipped: false }]
                  },
                  options: {
                     responsive: true,
                     maintainAspectRatio: false,
                     plugins: { legend: { display: false } },
                     scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false } } }
                  }
               });

               return () => {
                  if (chartInst1.current) chartInst1.current.destroy();
                  if (chartInst2.current) chartInst2.current.destroy();
               };
            }, [participaciones]);

            return (
               <div className="page">
                  <div className="page-header">
                     <div>
                        <div className="breadcrumb">
                           Catálogos <span>›</span> <span>Participaciones</span>
                        </div>
                        <h1 className="page-title">Listado de Participaciones</h1>
                        <p className="page-subtitle">Monitoreo y estadísticos de participación electoral</p>
                     </div>
                  </div>

                  {/* STATS */}
                  <div className="stats-grid">
                     <div className="stat-card">
                        <div className="stat-accent" />
                        <div className="stat-icon">🗳️</div>
                        <div className="stat-value">{participaciones.length}</div>
                        <div className="stat-label">Total Participaciones</div>
                        <div className="stat-change">↑ Actualizado ahora</div>
                     </div>
                     <div className="stat-card">
                        <div className="stat-accent blue" />
                        <div className="stat-icon blue">🪪</div>
                        <div className="stat-value">{totalINE}</div>
                        <div className="stat-label">Via INE</div>
                        <div className="stat-change" style={{ color: "#2980B9" }}>
                           {participaciones.length ? Math.round((totalINE / participaciones.length) * 100) : 0}% del total
                        </div>
                     </div>
                     <div className="stat-card">
                        <div className="stat-accent green" />
                        <div className="stat-icon green">📄</div>
                        <div className="stat-value">{totalDOC}</div>
                        <div className="stat-label">Via Carta Identidad</div>
                        <div className="stat-change" style={{ color: "#27AE60" }}>
                           {participaciones.length ? Math.round((totalDOC / participaciones.length) * 100) : 0}% del total
                        </div>
                     </div>
                     <div className="stat-card">
                        <div className="stat-accent orange" />
                        <div className="stat-icon orange">🏛️</div>
                        <div className="stat-value">{casillas.length}</div>
                        <div className="stat-label">Casillas con actividad</div>
                     </div>
                  </div>

                  {/* CHARTS */}
                  <div className="chart-grid mb-6">
                     <div className="card">
                        <div className="card-header">
                           <span className="card-title">Por tipo de documento</span>
                        </div>
                        <div className="card-body">
                           <div className="chart-wrap">
                              <canvas ref={chartRef1} />
                           </div>
                        </div>
                     </div>
                     <div className="card">
                        <div className="card-header">
                           <span className="card-title">Por casilla</span>
                        </div>
                        <div className="card-body">
                           <div className="chart-wrap">
                              <canvas ref={chartRef2} />
                           </div>
                        </div>
                     </div>
                  </div>

                  {/* TABLE */}
                  <div className="card">
                     <div className="card-header">
                        <div className="search-wrap">
                           <div className="search-input-wrap">
                              <span className="search-icon">🔍</span>
                              <input className="search-input" placeholder="Buscar por curp o casilla..." value={search} onChange={(e) => setSearch(e.target.value)} />
                           </div>
                           <select className="filter-select" value={filtroTipo} onChange={(e) => setFiltroTipo(e.target.value)}>
                              <option value="todos">Todos los tipos</option>
                              <option value="INE">INE</option>

                           <select className="filter-select" value={filtroCasilla} onChange={(e) => setFiltroCasilla(e.target.value)}>
                              <option value="todas">Todas las casillas</option>
                              {casillas.map((c) => (
                                 <option key={c} value={c}>
                                    {c}
                                 </option>
                              ))}
                           </select>
                        </div>
                        <span style={{ fontSize: 12, color: "var(--gris)", fontWeight: 600 }}>{filtered.length} registros</span>
                     </div>
                     <div className="table-wrap">
                        <table>
                           <thead>
                              <tr>
                                 <th>#</th>
                                 <th>Tipo</th>
                                 <th>CURP</th>
                                 <th>Casilla</th>
                                 <th>Fecha y Hora</th>
                              </tr>
                           </thead>
                           <tbody>
                              {filtered.length === 0 && (
                                 <tr>
                                    <td colSpan="5">
                                       <div className="empty-state">
                                          <div className="empty-icon">📊</div>
                                          <div className="empty-title">Sin registros</div>
                                          <div className="empty-desc">No hay participaciones que coincidan</div>
                                       </div>
                                    </td>
                                 </tr>
                              )}
                              {filtered.map((p, i) => (
                                 <tr key={p.id}>
                                    <td style={{ color: "var(--gris-claro)", fontSize: 12 }}>{String(i + 1).padStart(3, "0")}</td>
                                    <td>
                                       <span className={`badge ${p.tipo === "INE" ? "badge-ine" : "badge-doc"}`}>
                                          {p.tipo === "INE" ? "🪪" : "📄"} {p.tipo}
                                       </span>
                                    </td>
                                    <td>
                                       <span className="font-mono" style={{ fontSize: 12, color: "var(--negro)", fontWeight: 700 }}>
                                          {p.curp}

                                    <td>
                                       <span className="casilla-tag">🏛️ {p.casilla}</span>

                           </tbody>
                        </table>
                     </div>
                  </div>
               </div>
            );
         }

         // ============ PAGE: PERFIL ============
         function PagePerfil({ user }) {
            return (
               <div className="page">
                  <div className="page-header">
                     <div>
                        <div className="breadcrumb">
                           Cuenta <span>›</span> <span>Mi Perfil</span>
                        </div>
                        <h1 className="page-title">Mi Perfil</h1>
                        <p className="page-subtitle">Información del funcionario electoral</p>
                     </div>
                  </div>

                  <div className="profile-header-card">
                     <div className="profile-avatar-big">{user.iniciales}</div>
                     <div className="profile-info">
                        <div className="profile-name">{user.nombre}</div>
                        <div className="profile-cargo">{user.cargo}</div>
                        <div className="profile-casilla">🏛️ {user.casilla}</div>
                     </div>
                  </div>

                  <div className="grid-2">
                     <div className="card">
                        <div className="card-header">
                           <span className="card-title">👤 Datos Personales</span>
                        </div>
                        <div className="card-body">
                           {[
                              ["Nombre completo", user.nombre],
                              ["Cargo", user.cargo],
                              ["Correo electrónico", user.correo],
                              ["Estado", user.estado],
                              ["Municipio", user.municipio]
                           ].map(([label, val]) => (
                              <div key={label} className="info-row">
                                 <span className="info-row-label">{label}</span>
                                 <span className="info-row-val">{val}</span>
                              </div>
                           ))}
                        </div>
                     </div>

                     <div className="card">
                        <div className="card-header">
                           <span className="card-title">🏛️ Asignación Electoral</span>
                        </div>
                        <div className="card-body">
                           {[
                              ["Casilla asignada", user.casilla.split("•")[0].trim()],
                              ["Sección electoral", user.seccion],
                              ["Municipio", user.municipio],
                              ["Periodo", "Proceso Electoral 2026"],
                              ["Tipo de casilla", "Básica"]
                           ].map(([label, val]) => (
                              <div key={label} className="info-row">
                                 <span className="info-row-label">{label}</span>
                                 <span className="info-row-val">{val}</span>
                              </div>
                           ))}
                        </div>
                     </div>
                  </div>

                  <div className="card mt-4">
                     <div className="card-header">
                        <span className="card-title">ℹ️ Información del Sistema</span>
                     </div>
                     <div className="card-body">
                        <div className="grid-3">
                           {[
                              ["Versión del sistema", "v2.0.1"],
                              ["Última sesión", "2025-06-02 08:45:12"],
                              ["Navegador", "Chrome 120"]
                           ].map(([label, val]) => (
                              <div key={label}>
                                 <div style={{ fontSize: 11, color: "var(--gris)", textTransform: "uppercase", letterSpacing: 1, fontWeight: 700, marginBottom: 4 }}>
                                    {label}
                                 </div>
                                 <div style={{ fontSize: 14, color: "var(--negro)", fontWeight: 700 }}>{val}</div>
                              </div>
                           ))}
                        </div>
                     </div>
                  </div>
               </div>
            );
         }

         // ============ LOGIN PAGE ============
         function LoginPage({ onLogin }) {
            const [user, setUser] = useState("");
            const [pass, setPass] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const handleLogin = async () => {
               setError("");
               if (!user || !pass) {
                  setError("Complete todos los campos.");
                  return;
               }
               setLoading(true);
               await new Promise((r) => setTimeout(r, 1200));
               setLoading(false);
               if (user === "admin" && pass === "1234") {
                  onLogin();
               } else {
                  setError("Credenciales incorrectas. Use admin / 1234");
               }
            };

            return (
               <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, position: "relative", zIndex: 1 }}>
                  <div style={{ width: "100%", maxWidth: 420, animation: "pageIn 0.5s ease" }}>
                     <div style={{ textAlign: "center", marginBottom: 32 }}>
                        <div style={{ fontSize: 56, marginBottom: 12 }}>
                           <img src="./assets/images/logo.png" width="100%" alt="TuVozTransforma" />
                        </div>
                        <h1 style={{ fontFamily: "Playfair Display, serif", fontSize: 28, color: "var(--negro)", marginBottom: 6 }}>Sistema Electoral</h1>
                        <p style={{ fontSize: 13, color: "var(--gris)", fontWeight: 500 }}>Votaciones Gómez Palacio 2026</p>
                     </div>

                     <div className="card">
                        <div style={{ background: "var(--guinda)", padding: "16px 24px", borderRadius: "16px 16px 0 0" }}>
                           <p style={{ color: "#fff", fontSize: 13, fontWeight: 700, textAlign: "center" }}>🔐 Acceso Funcionarios Electorales</p>
                        </div>
                        <div className="card-body">
                           <div className="form-group">
                              <label className="form-label">Usuario</label>
                              <input
                                 className="form-input"
                                 placeholder="Ingrese su usuario"
                                 value={user}
                                 onChange={(e) => setUser(e.target.value)}
                                 onKeyDown={(e) => e.key === "Enter" && handleLogin()}
                              />
                           </div>
                           <div className="form-group">
                              <label className="form-label">Contraseña</label>
                              <input
                                 className="form-input"
                                 type="password"
                                 placeholder="••••••••"
                                 value={pass}
                                 onChange={(e) => setPass(e.target.value)}
                                 onKeyDown={(e) => e.key === "Enter" && handleLogin()}
                              />
                           </div>
                           {error && (
                              <div className="form-error" style={{ marginBottom: 16, background: "rgba(231,76,60,0.08)", padding: "10px 14px", borderRadius: 8 }}>
                                 ⚠ {error}
                              </div>
                           )}
                           <button className="btn-primary" onClick={handleLogin} disabled={loading}>
                              {loading ? (
                                 <>
                                    <span className="spinner" /> Autenticando...
                                 </>
                              ) : (
                                 <>→ Ingresar al Sistema</>
                              )}
                           </button>
                           <p style={{ textAlign: "center", fontSize: 11, color: "var(--gris-claro)", marginTop: 16 }}>Credenciales de demo: admin / 1234</p>
                        </div>
                     </div>
                     <p style={{ textAlign: "center", fontSize: 11, color: "var(--gris-claro)", marginTop: 20 }}>
                        Uso exclusivo para funcionarios electorales autorizados.
                        <br />© 2026 Ayuntamiento de Gómez Palacio
                     </p>
                  </div>
               </div>
            );
         }

         // ============ APP ============
         function App() {
            const [loggedIn, setLoggedIn] = useState(false);
            const [page, setPage] = useState("registro");
            const [swal, setSwal] = useState(null);
            const [participaciones, setParticipaciones] = useState(initialParticipaciones);
            const [casillas, setCasillas] = useState(initialCasillas);
            const [mobileMenu, setMobileMenu] = useState(false);

            const handleLogout = async () => {
               setSwal({ type: "info", title: "Sesión Cerrada", text: "Ha cerrado sesión correctamente. Hasta pronto.", btn: "Aceptar" });
               setTimeout(() => setLoggedIn(false), 100);
            };

            if (!loggedIn) return <LoginPage onLogin={() => setLoggedIn(true)} />;

            return (
               <>
                  {/* HEADER */}
                  <header className="header">
                     <div className="header-left">
                        <button className="sidebar-toggle" onClick={() => setMobileMenu((o) => !o)}>
                           ☰
                        </button>
                        <div>
                           <div className="header-title">Tu Voz Transforma</div>
                           <div className="header-subtitle">Proceso Participativo 2026</div>
                        </div>
                     </div>
                     <img src={"./assets/images/logo.png"} width="100px" className={""} />
                     <UserMenu user={currentUser} onNavigate={setPage} onLogout={handleLogout} />
                  </header>

                  {/* SIDEBAR */}
                  <Sidebar activePage={page} onNavigate={setPage} participaciones={participaciones} mobileOpen={mobileMenu} onClose={() => setMobileMenu(false)} />

                  {/* MAIN */}
                  <main className="main">
                     {page === "registro" && (
                        <PageRegistro participaciones={participaciones} setParticipaciones={setParticipaciones} setSwal={setSwal} user={currentUser} />
                     )}
                     {page === "casillas" && <PageCasillas casillas={casillas} setCasillas={setCasillas} />}
                     {page === "participaciones" && <PageParticipaciones participaciones={participaciones} />}
                     {page === "perfil" && <PagePerfil user={currentUser} />}
                  </main>

                  {/* SWEET ALERT */}
                  <SweetAlert config={swal} onClose={() => setSwal(null)} />
               </>
            );
         }

         ReactDOM.render(<App />, document.getElementById("root"));
      </script>
   </body>
</html>
